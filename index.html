<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#3b1f4a;--cream:#fff4dc;--tang:#ff6a2b;--mus:#ffc21a;--teal:#0fa3a3;--pink:#ff4d8d;--r1:#fff4dc;--r2:#ff8a3d}
@media (prefers-color-scheme:dark){:root{--r1:#3b1f4a;--r2:#5b2a63}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--plum);font:500 17px/1.3 "Fredoka","Trebuchet MS",sans-serif;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);position:relative;overflow-x:hidden}
.sun{position:fixed;left:50%;top:30%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;z-index:-2;background:repeating-conic-gradient(var(--r1) 0 7.5deg,var(--r2) 7.5deg 15deg);animation:spin 160s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(rgba(59,31,74,.28) 2.5px,transparent 3px) 0 0/16px 16px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
header{max-width:1180px;margin:0 auto;padding:26px 4px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px}
h1{margin:0;font:400 clamp(46px,10vw,112px)/.88 "Shrikhand","Georgia",serif;color:var(--cream);transform:rotate(-3deg);text-shadow:3px 3px 0 var(--plum),6px 6px 0 var(--pink),9px 9px 0 var(--plum)}
.sub{flex:1 1 230px;margin:0;font-size:21px;font-weight:600;background:var(--cream);border:4px solid var(--plum);border-radius:16px;padding:10px 16px;box-shadow:5px 5px 0 var(--plum);transform:rotate(1.5deg);max-width:340px}
#burst{width:132px;height:132px;display:grid;place-items:center;text-align:center;background:var(--mus);color:var(--plum);font:400 19px/1 "Shrikhand",serif;transform:rotate(12deg);margin-left:auto;filter:drop-shadow(5px 5px 0 var(--plum))}
.tools{width:100%;display:flex;flex-wrap:wrap;gap:12px;padding:14px 0 4px}
button{font:inherit;font-weight:600;color:var(--plum);background:var(--mus);border:4px solid var(--plum);border-radius:999px;padding:7px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--plum);transition:transform .12s,background .12s}
button:hover{background:var(--pink);transform:translate(-1px,-2px) rotate(-1.5deg)}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--plum)}
button.on,button[aria-pressed="true"]{background:var(--teal);color:var(--cream)}
:focus-visible{outline:4px solid var(--plum);outline-offset:3px;box-shadow:0 0 0 7px var(--cream)}
.ticker{max-width:1180px;margin:18px auto 0;background:var(--plum);color:var(--mus);border-radius:12px;border:4px solid var(--plum);overflow:hidden;white-space:nowrap;font-weight:600;font-size:18px}
.ticker span{display:inline-block;padding:7px 0 7px 100%;animation:run 30s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
.board{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 26px;padding:34px 4px 18px}
.card{position:relative;background:var(--cream);border:4px solid var(--plum);border-radius:20px;padding:10px;box-shadow:7px 7px 0 var(--plum);transform:rotate(var(--r));transition:transform .25s cubic-bezier(.3,1.7,.5,1),box-shadow .25s}
.card:hover,.card:focus-within{transform:rotate(0) scale(1.05);box-shadow:11px 11px 0 var(--plum);z-index:2}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px 6px}
.chead b{font:400 21px/1.1 "Shrikhand",serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead span{font-size:14px;font-weight:600;color:var(--tang);white-space:nowrap}
.snap{display:block;width:100%;padding:0;border-radius:12px;box-shadow:none;background:none;border-width:4px;overflow:hidden;position:relative}
.snap:hover{background:none;transform:none}
.snap img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--mus)}
.snap::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,77,141,.55) 2px,transparent 2.5px) 0 0/10px 10px;-webkit-mask-image:radial-gradient(circle at 100% 100%,#000,transparent 45%);mask-image:radial-gradient(circle at 100% 100%,#000,transparent 45%);pointer-events:none}
.star{position:absolute;top:56px;right:20px;z-index:3;width:42px;height:42px;padding:0;border-radius:50%;font-size:21px;line-height:1;display:grid;place-items:center;background:var(--cream)}
.star[aria-pressed="true"]{background:var(--pink)}
.rare{display:block;margin:9px 0 6px;padding:3px 10px;border:3px solid var(--plum);border-radius:999px;font-size:14px;font-weight:600;text-align:center;background:var(--teal);color:var(--cream)}
.rare[data-k="rare"]{background:var(--pink)}
.rare[data-k="epic"]{background:var(--mus);color:var(--plum)}
.rare[data-k="legend"]{background:linear-gradient(100deg,#ff4d8d,#ffc21a,#0fa3a3,#ff4d8d) 0 0/300% 100%;color:var(--plum);animation:foil 3s linear infinite}
@keyframes foil{to{background-position:300% 0}}
.q{margin:0 0 8px;font-size:15px;line-height:1.25}
.mini{display:flex;justify-content:space-between;border-top:3px dashed var(--plum);padding-top:6px;font-size:14px;font-weight:600}
.empty{grid-column:1/-1;justify-self:center;background:var(--cream);border:4px solid var(--plum);border-radius:20px;box-shadow:7px 7px 0 var(--plum);padding:24px 28px;font:400 26px/1.2 "Shrikhand",serif;text-align:center;max-width:520px;transform:rotate(-1.5deg)}
footer{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0 60px}
.note{margin:0;background:var(--cream);border:4px solid var(--plum);border-radius:14px;padding:8px 18px;box-shadow:5px 5px 0 var(--plum);transform:rotate(-1.5deg)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20;max-width:min(440px,90vw);background:var(--cream);border:4px solid var(--plum);border-radius:18px;box-shadow:6px 6px 0 var(--plum);padding:12px 18px;font-weight:600;text-align:center;transform:translate(-50%,160%);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
#toast.show{transform:translate(-50%,0)}
dialog{border:0;padding:0;background:transparent;color:var(--plum);width:min(470px,92vw);max-width:92vw;overflow:visible}
dialog::backdrop{background:rgba(59,31,74,.82)}
.frame{background:var(--cream);border:5px solid var(--plum);border-radius:24px;padding:14px;box-shadow:9px 9px 0 var(--pink);max-height:92vh;overflow:auto}
.frame img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:4px solid var(--plum);border-radius:14px;background:var(--mus)}
.frame img.dev{animation:dev 1.2s ease-out}
@keyframes dev{from{filter:sepia(1) blur(12px) brightness(1.5);opacity:.2}to{filter:none;opacity:1}}
#bn{margin:12px 0 4px;font:400 32px/1.05 "Shrikhand",serif}
#bq{margin:10px 0;background:var(--mus);border:3px solid var(--plum);border-radius:14px;padding:8px 12px;font-size:16px}
.stats{display:grid;gap:7px;margin:10px 0 14px}
.stats div{display:grid;grid-template-columns:72px 1fr 38px;align-items:center;gap:10px;font-size:15px;font-weight:600}
.meter{height:16px;border:3px solid var(--plum);border-radius:999px;background:linear-gradient(var(--c),var(--c)) 0 0/var(--v) 100% no-repeat var(--cream)}
.row{display:flex;flex-wrap:wrap;gap:9px}
.row button{padding:5px 14px;font-size:16px;box-shadow:3px 3px 0 var(--plum);border-width:3px}
@media (prefers-reduced-motion:reduce){.sun,.ticker span,.rare[data-k="legend"],.frame img.dev{animation:none!important}.card,#toast{transition:none}.ticker span{padding-left:12px}}
</style>
</head>
<body>
<div class="sun" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div>
<header>
  <h1>Cat Browser</h1>
  <p class="sub">Collect ’em all. Feed none of ’em.</p>
  <div id="burst" aria-hidden="true"><span>100% real cats!</span></div>
  <div class="tools">
    <button id="fetch" type="button">Fetch new cats</button>
    <button id="oracle" type="button">Cat oracle</button>
    <button id="surprise" type="button">Surprise me</button>
    <button id="shuffle" type="button">Shuffle deck</button>
    <button id="colBtn" type="button" aria-pressed="false">★ Collection (0)</button>
  </div>
</header>
<div class="ticker"><span>★ AS SEEN ON TV ★ NOW WITH 40% MORE CAT ★ NO DOGS WERE CONSULTED ★ ACT NOW: SUPPLIES OF CAT ARE UNLIMITED ★ BATTERIES NOT INCLUDED, CATS NOT REFUNDABLE ★</span></div>
<main class="board" id="board"></main>
<footer>
  <button id="loadmore" type="button">Load more cats</button>
  <p class="note" id="status" role="status">Loading cats…</p>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="bn">
  <div class="frame">
    <img id="big" alt="">
    <h2 id="bn"></h2>
    <span class="rare" id="brare"></span>
    <p id="bq"></p>
    <div class="stats" id="stats"></div>
    <div class="row">
      <button id="prev" type="button" aria-label="Previous cat">←</button>
      <button id="next" type="button" aria-label="Next cat">→</button>
      <button id="meow" type="button">Meow</button>
      <button id="dcol" type="button" aria-pressed="false">★ Collect</button>
      <button id="rename" type="button">Rename</button>
      <button id="close" type="button">Close</button>
    </div>
  </div>
</dialog>

<script>
var NAMES=["Sir Biscuit","Gerald","Princess Noodle","Mr. Gloom","Bleh","Doug","Mittens III","Tigger Jr.","Prof. Whiskers","Sleepy Pete","Void","Captain Fluff","Brenda","Lord Nugget","Pickles","Dr. Toes","Waffles","Big Gary","Madame Fuzz","Steve","Kevin","Meowdonna"];
var QUOTES=["Loaf status: pending.","Has never once been right.","Rules this room. Not the next one.","Sees right through you.","Cool. Very cool. Pls clap.","The first two were a lie.","Lectures at 3 a.m.","Do not look directly.","Sails the couch. Fears the vacuum.","Owes you nothing.","Knocked it off the table. On purpose.","Has opinions about your chair.","Will fit in any box. Any.","Invoice for emotional damage: pending."];
var FORT=["You will soon be sat upon.","A box approaches. Accept it.","Someone will say “pspsps.” It will be you.","Your keyboard is about to be a bed.","Beware the 3 a.m. zoomies.","The red dot is not real. Chase it anyway.","Good things come to those who knock stuff off tables.","You will be judged. Silently. Warmly.","A sunbeam awaits you at 2:15 p.m.","Today you will ignore someone very important."];
var STATS=["Sass","Fluff","Zoomies"],COLS=["#ff4d8d","#0fa3a3","#ff6a2b"];
var STATUS=["0 dogs invited.","All cats accounted for. Probably.","Please do not tap the glass.","Cats loaded. Furniture at risk.","Judging you since page load."];
var cats=[],coll=[],view="deck",cur=0,ctx=null,tt=null;
var $=function(i){return document.getElementById(i)};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var rnd=function(a,b){return a+Math.random()*(b-a)};
var dlg=$("dlg");

// starburst badge
(function(){var p=[];for(var i=0;i<24;i++){var a=i*Math.PI/12,r=i%2?38:50;p.push((50+r*Math.cos(a)).toFixed(1)+"% "+(50+r*Math.sin(a)).toFixed(1)+"%")}$("burst").style.clipPath="polygon("+p.join(",")+")"})();

try{coll=JSON.parse(localStorage.getItem("cat-browser-collection")||"[]")}catch(e){coll=[]}
function save(){try{localStorage.setItem("cat-browser-collection",JSON.stringify(coll))}catch(e){}}
function has(k){return coll.some(function(c){return c.src===k.src})}
function list(){return view==="col"?coll:cats}
function rarity(k){var t=k.s[0]+k.s[1]+k.s[2];
  if(t>=25)return["legend","LEGENDARY LOAF"];if(t>=20)return["epic","Epic Gremlin"];if(t>=14)return["rare","Rare Menace"];return["common","Common Housecat"]}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},3600)}

function cataas(i){return "https://cataas.com/cat?width=600&height=600&t="+Date.now()+i}
async function getCats(n){
  var out=[];
  try{
    var r=await fetch("https://api.thecatapi.com/v1/images/search?limit="+Math.min(n,10)+"&size=med");
    var d=await r.json();
    out=d.map(function(x){return{src:x.url,from:"thecatapi.com"}});
  }catch(e){}
  while(out.length<n)out.push({src:cataas(out.length),from:"cataas.com"});
  return out.map(function(x){return{src:x.src,from:x.from,n:pick(NAMES),q:pick(QUOTES),r:+rnd(-4,4).toFixed(1),s:STATS.map(function(){return Math.round(rnd(1,10))})}});
}
async function load(more){
  $("status").textContent="Dealing cats…";
  var n=await getCats(more?8:12);
  cats=more?cats.concat(n):n;view="deck";render();
}

function render(){
  var L=list(),g=$("board");g.innerHTML="";
  if(!L.length){var e=document.createElement("p");e.className="empty";
    e.textContent=view==="col"?"Your collection is empty. Tap a ★ on a cat you want.":"The deck is empty. Fetch some cats!";g.appendChild(e)}
  L.forEach(function(k,i){
    var a=document.createElement("article");a.className="card";a.style.setProperty("--r",k.r+"deg");
    var h=document.createElement("div");h.className="chead";
    var nm=document.createElement("b");nm.textContent=k.n;
    var hp=document.createElement("span");hp.textContent="HP "+(k.s[0]+k.s[1]+k.s[2])*10;
    h.append(nm,hp);
    var snap=document.createElement("button");snap.className="snap";snap.type="button";snap.setAttribute("aria-label","Open "+k.n);
    var im=document.createElement("img");im.loading="lazy";im.alt=k.n+", a cat";im.src=k.src;
    im.onerror=function(){im.onerror=null;im.src=cataas(i)};
    snap.appendChild(im);snap.onclick=function(){show(i)};
    var st=document.createElement("button");st.className="star";st.type="button";st.textContent="★";
    st.setAttribute("aria-label",(has(k)?"Remove ":"Collect ")+k.n);st.setAttribute("aria-pressed",String(has(k)));
    st.onclick=function(){collect(k)};
    var rr=rarity(k),rb=document.createElement("span");rb.className="rare";rb.dataset.k=rr[0];rb.textContent=rr[1];
    var q=document.createElement("p");q.className="q";q.textContent=k.q;
    var m=document.createElement("div");m.className="mini";
    k.s.forEach(function(v,j){var s=document.createElement("span");s.textContent=STATS[j]+" "+v;m.appendChild(s)});
    a.append(h,snap,st,rb,q,m);g.appendChild(a);
  });
  $("colBtn").textContent="★ Collection ("+coll.length+")";
  $("colBtn").setAttribute("aria-pressed",String(view==="col"));
  $("loadmore").hidden=view==="col";
  $("status").textContent=view==="col"?coll.length+" in your collection. Exquisite taste.":cats.length+" cats loaded. "+pick(STATUS);
}

function collect(k){
  var was=has(k);
  coll=was?coll.filter(function(c){return c.src!==k.src}):coll.concat([{src:k.src,from:k.from,n:k.n,q:k.q,r:k.r,s:k.s}]);
  save();render();if(dlg.open)sync();
  toast(was?k.n+" has been released back into the wild.":k.n+" joined your collection!");
}
function sync(){var k=list()[cur];if(!k)return;var h=has(k),b=$("dcol");b.textContent=h?"★ Collected":"★ Collect";b.setAttribute("aria-pressed",String(h))}

function show(i){
  var L=list();if(!L.length)return;
  cur=(i+L.length)%L.length;var k=L[cur];
  var im=$("big");im.src=k.src;im.alt=k.n+", a cat";im.classList.remove("dev");void im.offsetWidth;im.classList.add("dev");
  $("bn").textContent=k.n;$("bq").textContent="“"+k.q+"”";
  var rr=rarity(k),rb=$("brare");rb.dataset.k=rr[0];rb.textContent=rr[1];
  var st=$("stats");st.innerHTML="";
  k.s.forEach(function(v,j){
    var r=document.createElement("div"),l=document.createElement("span"),m=document.createElement("span"),n=document.createElement("span");
    l.textContent=STATS[j];m.className="meter";m.style.setProperty("--v",v*10+"%");m.style.setProperty("--c",COLS[j]);n.textContent=v+"/10";
    r.append(l,m,n);st.appendChild(r);
  });
  sync();if(!dlg.open)dlg.showModal();
}

function meow(){
  try{
    var A=window.AudioContext||window.webkitAudioContext;ctx=ctx||new A();
    var t=ctx.currentTime,o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    var base=rnd(380,520);
    o.type="sawtooth";f.type="bandpass";f.Q.value=3;
    o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*2.1,t+.2);o.frequency.exponentialRampToValueAtTime(base*.8,t+.65);
    f.frequency.setValueAtTime(700,t);f.frequency.linearRampToValueAtTime(2300,t+.22);f.frequency.linearRampToValueAtTime(900,t+.65);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.07);g.gain.linearRampToValueAtTime(0,t+.7);
    o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.75);
  }catch(e){}
  toast(pick(["MEOW.","mrrrow?","MROWWW!","*aggressive purring*","meep."]));
}

$("prev").onclick=function(){show(cur-1)};
$("next").onclick=function(){show(cur+1)};
$("close").onclick=function(){dlg.close()};
$("meow").onclick=meow;
$("dcol").onclick=function(){var k=list()[cur];if(!k)return;collect(k);if(dlg.open&&view==="col"){if(!list().length)dlg.close();else show(cur)}};
$("rename").onclick=function(){
  var k=list()[cur];if(!k)return;var n=prompt("New name for this cat:",k.n);
  if(n&&n.trim()){var nn=n.trim().slice(0,22);cats.concat(coll).forEach(function(x){if(x.src===k.src)x.n=nn});save();$("bn").textContent=nn;render()}
};
$("surprise").onclick=function(){var L=list();if(L.length)show(Math.floor(Math.random()*L.length))};
$("oracle").onclick=function(){toast("🔮 "+pick(FORT))};
$("shuffle").onclick=function(){
  var L=list();for(var i=L.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=L[i];L[i]=L[j];L[j]=t}
  L.forEach(function(k){k.r=+rnd(-4,4).toFixed(1)});save();render();
};
$("colBtn").onclick=function(){view=view==="col"?"deck":"col";render()};
$("fetch").onclick=function(){load(false)};
$("loadmore").onclick=function(){load(true)};
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
dlg.addEventListener("keydown",function(e){if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1)});
load(false);
</script>
</body>
</html>
